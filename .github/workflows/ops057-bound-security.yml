name: OPS057 read-only same-handle security descriptor
on:
  push:
    branches: [main]
    paths:
      - 'ci-fixtures/native/ops057/**'
      - '.github/workflows/ops057-bound-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-security-control:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Checkout generic public fixture only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Read-only API observation on disposable runner folder
        shell: pwsh
        run: ./ci-fixtures/native/ops057/ops057_same_handle_sd.ps1
      - name: Upload metadata-only receipt (not SIDs/ACL contents)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ops057-bound-security-${{ matrix.os }}
          path: ${{ runner.temp }}/ops057-public-metadata/receipt.json
          if-no-files-found: error
          retention-days: 2
