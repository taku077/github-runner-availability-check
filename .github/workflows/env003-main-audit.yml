name: ENV003 public main ruleset audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  env003-main-rules:
    name: env003-main-rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read-only GitHub ruleset check and untrusted-request fixtures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RULESET: PCFM-Public-CI-Main-Protection
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          expected = os.environ['EXPECTED_RULESET']
          token = os.environ['GH_TOKEN']
          assert repo.count('/') == 1 and all(part for part in repo.split('/'))

          def github_json(path):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + path,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': 'Bearer ' + token,
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'pcfm-env003-readonly',
                  },
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  raw = response.read(1_000_001)
              if len(raw) > 1_000_000:
                  raise ValueError('Provider response exceeds the configured limit')
              return json.loads(raw)

          branch = github_json('/branches/main')
          assert branch.get('name') == 'main', 'Unexpected main branch'
          assert branch.get('protected') is True, 'Main branch is not protected'
          head_sha = branch['commit']['sha']
          assert len(head_sha) == 40, 'Invalid git revision metadata'

          rulesets = github_json('/rulesets')
          matches = [r for r in rulesets
                     if r.get('name') == expected and r.get('target') == 'branch'
                     and r.get('enforcement') == 'active']
          assert len(matches) == 1, 'Named active ruleset missing or ambiguous'
          rid = matches[0]['id']
          detail = github_json('/rulesets/' + str(rid))
          assert detail['conditions']['ref_name']['include'] == ['~DEFAULT_BRANCH'], 'Wrong branch target'
          # The low-privilege GITHUB_TOKEN may omit bypass_actors entirely.
          # Unknown is NOT an empty list; require independent privileged readback.
          bypass_visible = 'bypass_actors' in detail
          if bypass_visible:
              assert detail['bypass_actors'] == [], 'Unexpected bypass actor'
          else:
              print('ENV003_BYPASS_LIST_NOT_VISIBLE: independent readback required')
          types = {rule['type'] for rule in detail['rules']}
          assert {'pull_request', 'deletion', 'non_fast_forward'} <= types, 'Required restrictions missing'
          review_rules = [rule for rule in detail['rules']
                          if rule['type'] == 'pull_request']
          assert len(review_rules) == 1, 'Missing or ambiguous pull request rule'
          review_count = review_rules[0].get('parameters', {}).get(
              'required_approving_review_count')
          assert type(review_count) is int and review_count >= 0, 'Invalid review quorum'
          # Transitional observer: report the existing zero-approval state without
          # blocking a future approved increase to the required review count.
          # CI success is not itself evidence of an independent review.
          if review_count == 0:
              print('ENV003_REVIEW_GATE_NOT_ENFORCED: approvals_required=0')
          else:
              print('ENV003_REVIEW_RULE_PRESENT_NOT_ATTESTED: approvals_required=' +
                    str(review_count))
          # Simple offline invariants for type/confusion errors.
          for synthetic_count in (0, 1, 2):
              assert type(synthetic_count) is int and synthetic_count >= 0
          for invalid_count in (True, -1, None, '1'):
              assert not (type(invalid_count) is int and invalid_count >= 0)

          # Demonstration only: this is not a mediator for ChatGPT or GitHub writes.
          def synthetic_gate(request):
              # Untrusted text must never promote itself into user authorization.
              if request['source'] != 'independent-operator-signed':
                  return 'DENY'
              if request['operation'] not in ('read-only', 'offline-synthetic-test'):
                  return 'DENY'
              if request['target'] != 'isolated-fixture':
                  return 'DENY'
              return 'ALLOW'

          benign = {'source': 'independent-operator-signed',
                    'operation': 'offline-synthetic-test', 'target': 'isolated-fixture'}
          assert synthetic_gate(benign) == 'ALLOW'
          attacks = [
              {'source':'untrusted-document','operation':'offline-synthetic-test','target':'isolated-fixture'},
              {'source':'provider-text','operation':'read-only','target':'isolated-fixture'},
              {'source':'independent-operator-signed','operation':'write-file','target':'isolated-fixture'},
              {'source':'independent-operator-signed','operation':'merge','target':'isolated-fixture'},
              {'source':'independent-operator-signed','operation':'stop-audit','target':'isolated-fixture'},
              {'source':'independent-operator-signed','operation':'offline-synthetic-test','target':'main'},
              {'source':'user-message-unverified','operation':'write-file','target':'main'},
          ]
          for i, attempt in enumerate(attacks, 1):
              assert synthetic_gate(attempt) == 'DENY', 'Synthetic case ' + str(i)

          # Public metadata only. No private source, credentials, or forensic records.
          print('ENV003_RULESET_METADATA_PASS')
          print('repository=' + repo + ' main_sha=' + head_sha[:12])
          print('ruleset_id=' + str(rid) + ' enforcement=active bypass=' +
                ('[]' if bypass_visible else 'NOT_VERIFIED_BY_CI'))
          print('synthetic_gate_allow=1 synthetic_gate_denied=' + str(len(attacks)))
          print('ADMISSION=NOT_ACCEPTED: CI success is not independent write prevention or proof of actor identity.')
          PY
